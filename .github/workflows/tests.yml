name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: MacGamesCore
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Swift version
        run: swift --version
      - name: Run tests
        working-directory: Packages/MacGamesCore
        run: swift test
